<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Inspection — WorkLink SA</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">↗ WORKLINK <b>SA</b></a><button class="nav-toggle" aria-label="Toggle navigation" aria-controls="navDrawer">☰</button><nav id="mainNav"><a href="index.html#market">Registry</a><a href="index.html#trust">Trust Centre</a></nav><div id="navDrawer" class="nav-drawer" aria-label="Mobile navigation"><a href="index.html#market">Registry</a><a href="index.html#trust">Trust Centre</a></div><a class="outline" href="index.html#submit">Submit for Review</a></header><main class="detail" id="detail"></main><script src="firebase-config.js"></script><script src="app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{
  const navToggle = document.querySelector('.nav-toggle');
  const navDrawer = document.getElementById('navDrawer');
  
  navToggle.addEventListener('click', function() {
    navDrawer.classList.toggle('active');
    navToggle.setAttribute('aria-expanded', navDrawer.classList.contains('active'));
  });
  
  const id=new URLSearchParams(location.search).get('id'),a=listing(id);const d=document.querySelector('#detail');if(!a){d.innerHTML='<h1>RECORD NOT FOUND</h1>';return}d.innerHTML=`<div class="sectiontag">ASSET INSPECTION / ${a.id}</div><h1>${a.title}</h1><div class="statusline">STATUS: <b>${a.status}</b> &nbsp; TRUST: <b>${a.score}/100</b> &nbsp; RISK: <b>${a.risk}</b></div><div class="detailgrid"><section><h3>INSPECTION SUMMARY</h3><p>${a.desc}</p><p>Asking price: <b>${money(a.price)}</b></p><h3>EVIDENCE LEDGER</h3><div class="ledger"><div>EV-001 <span>IDENTITY / SELLER</span><b>REVIEWED</b></div><div>EV-002 <span>OWNERSHIP</span><b>REVIEWED</b></div><div>EV-003 <span>PERFORMANCE CLAIMS</span><b class="partial">AS DISCLOSED</b></div></div></section><aside class="offerbox"><div class="sectiontag">FORMAL OFFER</div><p>Offers are recorded before a transaction room is created.</p><form id="offerForm"><input type="hidden" name="asset" value="${a.id}"><div class="form-group"><label for="buyer">Buyer Name / Company</label><input id="buyer" name="buyer" required placeholder="Buyer name / company" aria-required="true"></div><div class="form-group"><label for="amount">Offer Amount (ZAR)</label><input id="amount" name="amount" required type="number" min="1" placeholder="Offer amount (ZAR)" aria-required="true"></div><button class="primary">MAKE FORMAL OFFER →</button></form></aside></div>`})
</script></body></html>
